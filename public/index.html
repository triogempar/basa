<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basa - AI English Roleplay & Grammar Coach</title>
  <meta name="description" content="Master English conversation with Basa AI companions Raya and Atma. Clean, minimalist roleplay and live grammar feedback.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Minimalist Single Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-title-wrap">
          <h1>Basa<span class="brand-dot">.ai</span></h1>
        </div>
      </div>

      <!-- Right Header Actions -->
      <div class="header-right">
        <div class="avatar-tabs" id="avatarTabs">
          <button class="tab-btn active" data-avatar="raya" id="tabRaya">
            <span class="avatar-icon">✨</span>
            <span class="avatar-name">Raya</span>
          </button>
          <button class="tab-btn" data-avatar="atma" id="tabAtma">
            <span class="avatar-icon">💼</span>
            <span class="avatar-name">Atma</span>
          </button>
        </div>

        <!-- Audio TTS Icon Toggle -->
        <button class="header-action-btn active" id="ttsToggleBtn" title="Toggle Auto Voice Read">
          <span id="ttsIcon">🔊</span>
        </button>

        <button class="header-action-btn" id="clearChatBtn" title="Reset Session">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </header>


    <!-- Error Banner -->
    <div class="error-banner hidden" id="errorBanner">
      <div class="error-content">
        <span class="error-icon">⚠️</span>
        <span id="errorMessage">An error occurred. Please check your configuration.</span>
      </div>
      <button class="dismiss-btn" id="dismissError" title="Dismiss">&times;</button>
    </div>

    <!-- Chat Messages Container -->
    <main class="chat-container" id="chatContainer">
      <!-- Dynamic chat messages -->
    </main>

    <!-- Typing Indicator -->
    <div class="typing-indicator hidden" id="typingIndicator">
      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <span id="typingText">Raya is typing...</span>
    </div>

    <!-- Minimal Input Bar -->
    <footer class="chat-footer">
      <form class="input-form" id="chatForm">
        <div class="input-wrapper">
          <textarea 
            id="userInput" 
            placeholder="Type your response in English..." 
            rows="1" 
            autocomplete="off"
            required></textarea>
        </div>
        <button type="submit" id="sendBtn" class="send-btn" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <div class="footer-tip">
        <span>💡 Practice English roleplay naturally. Get instant Indonesian grammar feedback on any mistakes!</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
